<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thibitisha Uwepo - RSVP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{
 --indigo-night:#24243A;--indigo:#164F9B;--signal-red:#F06A3D;--signal-red-deep:#E92F4D;
 --warm-bg:#ECEBE8;--warm-card:#FFFEFD;--ink:#202638;--muted:#596174;--line:#D8DCE5;
 --success:#087F70;--danger:#E92F4D;
}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(ellipse at 10% 0%,rgba(240,106,61,.12),transparent 42%),linear-gradient(145deg,#ECEBE8,#E3E1DE);color:var(--ink);font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif}
.card{width:100%;max-width:440px;background:linear-gradient(160deg,#24243A 0%,#202638 100%);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:34px 30px;text-align:center;box-shadow:0 22px 55px rgba(36,36,58,.22);color:#fff}
.brand-mark{width:76px;height:76px;margin:0 auto 10px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#FFFEFD;border:3px solid rgba(255,255,255,.16);box-shadow:0 8px 22px rgba(0,0,0,.2);color:#24243A}.brand-mark img{width:100%;height:100%;object-fit:contain}
.brand-name{font-size:15px;font-weight:800;letter-spacing:.02em;color:#fff;margin:0 auto 20px;max-width:100%;overflow-wrap:anywhere}
.status-mark{width:58px;height:58px;margin:0 auto 18px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(240,106,61,.16);color:#FF8B68;font-size:24px;font-weight:700}
h1{font-size:21px;line-height:1.3;font-weight:800;letter-spacing:-.45px;color:#fff;margin-bottom:9px}
p{font-size:14px;line-height:1.7;color:#E5E7EF}
.guest-name{margin:12px 0 20px;padding:12px 14px;border:1px solid rgba(255,255,255,.18);border-radius:12px;background:rgba(255,255,255,.08);color:#fff;font-size:16px;font-weight:700}
.status-yes{color:#54D6B2}.status-no{color:#FF9A80}.status-err{color:#FF8A9B}
.spinner{width:38px;height:38px;border:3px solid rgba(255,255,255,.18);border-top-color:#F06A3D;border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-row{display:flex;flex-direction:column;gap:12px;margin-top:25px}
.rsvp-btn{width:100%;min-height:52px;padding:14px 18px;border-radius:12px;border:1px solid transparent;font:700 14px Inter,sans-serif;cursor:pointer;transition:transform .15s,background .15s,box-shadow .15s}
.rsvp-btn:active{transform:scale(.985)}.rsvp-btn:disabled{opacity:.6;cursor:default}
.btn-yes{background:linear-gradient(120deg,#F06A3D 0%,#E92F4D 100%);color:#fff;box-shadow:0 7px 18px rgba(233,47,77,.24)}.btn-yes:hover{background:linear-gradient(120deg,#E92F4D 0%,#F06A3D 100%)}
.btn-no{background:linear-gradient(120deg,#24243A 0%,#164F9B 100%);color:#fff;border-color:rgba(255,255,255,.22);box-shadow:0 7px 18px rgba(36,36,58,.28)}.btn-no:hover{background:linear-gradient(120deg,#164F9B 0%,#24243A 100%);border-color:rgba(255,255,255,.5)}
.footer-note{margin-top:24px;padding-top:16px;border-top:1px solid rgba(255,255,255,.15);font-size:11px;color:#B8BDCA}
@media(max-width:420px){.card{padding:30px 22px;border-radius:18px}h1{font-size:19px}}
</style>
</head>
<body>

<div class="card" id="card">
  <div class="brand-mark" id="brandMark"></div>
  <div class="brand-name" id="brandName">Snap Cards</div>
  <div class="spinner"></div>
  <h1>Inapakia taarifa</h1>
  <p>Tafadhali subiri kidogo.</p>
  <div class="footer-note">Snap Cards · Mfumo wa Mialiko</div>
</div>

<script>
const SUPABASE_URL = 'https://cornvepcsdfiiyivdfzn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_H5cF-9Wsdo8o3r5GassjXQ_dr4fuxP8';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const card = document.getElementById('card');

// Utambulisho wa ukurasa huu unafuata Main Name na Logo zilizowekwa kwenye System Branding.
let rsvpBranding = { name: 'Snap Cards', logo: '' };

function paintRsvpBranding() {
  const mark = document.getElementById('brandMark');
  const nameEl = document.getElementById('brandName');
  if (nameEl) nameEl.textContent = rsvpBranding.name || 'Snap Cards';
  if (mark) {
    mark.replaceChildren();
    if (rsvpBranding.logo) {
      const img = document.createElement('img');
      img.src = rsvpBranding.logo;
      img.alt = (rsvpBranding.name || 'System') + ' logo';
      img.onerror = () => img.remove();
      mark.appendChild(img);
    } else {
      mark.textContent = (rsvpBranding.name || 'Snap Cards').trim().slice(0, 2).toUpperCase();
      mark.style.color = '#0047AB';
      mark.style.fontWeight = '800';
      mark.style.fontSize = '20px';
    }
  }
}
function brandHeaderHtml() {
  const name = (rsvpBranding.name || 'Snap Cards')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const logo = rsvpBranding.logo
    ? '<img src="' + rsvpBranding.logo.replace(/"/g, '&quot;') + '" alt="System logo">'
    : '';
  return '<div class="brand-mark" id="brandMark">' + logo + (logo ? '' : name.slice(0,2).toUpperCase()) + '</div><div class="brand-name" id="brandName">' + name + '</div>';
}
async function loadRsvpBranding() {
  try {
    const { data, error } = await sb.rpc('get_public_system_branding');
    if (error) throw error;
    const row = Array.isArray(data) ? data[0] : data;
    if (row) {
      rsvpBranding.name = row.main_name || rsvpBranding.name;
      rsvpBranding.logo = row.logo_url || rsvpBranding.logo;
      paintRsvpBranding();
    }
  } catch (e) {
    console.warn('System branding haikupatikana; nimetumia utambulisho uliohifadhiwa.', e);
  }
}

let currentCardId = null;

function showInvalidLink() {
  card.innerHTML = `
    <div class="status-mark">!</div>
    <h1 class="status-err">Kiungo si sahihi</h1>
    <p>Tafadhali fungua kiungo cha uthibitisho ulichotumiwa kwenye ujumbe wa WhatsApp.</p>`;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[char]);
}

function showChoiceScreen(guestName) {
  card.innerHTML = `
    ${brandHeaderHtml()}
    <h1>Thibitisha Uwepo Wako</h1>
    ${guestName ? `<div class="guest-name">${escapeHtml(guestName)}</div>` : ''}
    <p>Tafadhali chagua hali yako ya mahudhurio kwa tukio hili.</p>
    <div class="btn-row">
      <button class="rsvp-btn btn-yes" id="btnYes" onclick="submitChoice('yes')">Nitahudhuria</button>
      <button class="rsvp-btn btn-no" id="btnNo" onclick="submitChoice('no')">Sitahudhuria</button>
    </div>
  `;
}

async function submitChoice(status) {
  document.getElementById('btnYes').disabled = true;
  document.getElementById('btnNo').disabled = true;
  document.getElementById(status === 'yes' ? 'btnYes' : 'btnNo').textContent = 'Inatuma...';

  // "Last click wins": tunatuma hali mpya kila mara - hata kama alishajibu awali,
  // jibu la MWISHO alilobonyeza ndilo litakalobaki kwenye mfumo.
  let data = null;
  let error = null;

  try {
    const result = await sb.rpc('submit_rsvp', {
      card_id_input: currentCardId,
      status_input: status
    });
    data = result.data;
    error = result.error;
  } catch (err) {
    error = err;
  }

  if (error || !data || data.success === false) {
    console.error('RSVP submission failed:', error || data);
    const message = (data && data.message)
      ? data.message
      : 'Imeshindwa kuhifadhi jibu lako. Tafadhali jaribu tena au wasiliana na mwenyeji.';
    card.innerHTML = `
      <div class="status-mark">!</div>
      <h1 class="status-err">Imeshindwa</h1>
      <p>${message}</p>`;
    return;
  }

  if (status === 'yes') {
    card.innerHTML = `
      <div class="status-mark">✓</div>
      <h1 class="status-yes">Tunashukuru kwa uwepo wako</h1>
      <p>Uthibitisho wako umepokelewa. Karibu sana.</p>`;
  } else {
    card.innerHTML = `
      <div class="status-mark">✓</div>
      <h1 class="status-no">Tumepokea jibu lako</h1>
      <p>Asante kwa kutujulisha. Tutakukumbuka.</p>`;
  }
}

function init() {
  const params = new URLSearchParams(window.location.search);
  // URLSearchParams tayari huondoa URL encoding; hapa tunaondoa {1} ya ziada tu.
  const rawCardId = (params.get('id') || '').trim();
  const cardId = rawCardId.replace(/^\{1\}/i, '').trim();

  if (!cardId) {
    showInvalidLink();
    return;
  }

  currentCardId = cardId;
  // Hakuna haja ya kupata jina la mgeni kabla - moja kwa moja tunaonyesha
  // chaguo mbili. Ukitaka jina lionekane hapo juu, unaweza kuongeza RPC
  // ya kusoma jina peke yake (bila taarifa nyingine nyeti) baadaye.
  showChoiceScreen(null);
}

loadRsvpBranding();
init();
</script>

</body>
</html>
